<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestellapp</title>

    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/basket.css" />

    <script src="./scripts/db.js" defer></script>
    <script src="./scripts/template.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <header class="mainHeader">
    <div class="headerContent">
      <img
        class="headerLogo"
        src="./assets/icons/logo.svg"
        alt="BestellApp logo"
      />

      <img class="menuIcon" src="./assets/icons/menu.svg" alt="menu-icon" />
    </div>
  </header>

  <main>
    <div class="hero">
      <img class="hero-image" src="./assets/img/hero-pic.jpg" alt="herobild" />
    </div>

    <div class="restaurant-info">
      <img
        class="restaurant-logo"
        src="./assets/img/burger-header-logo.svg"
        alt="Burger-logo-cricle"
      />
    </div>
  </main>

  <body></body>
</html>
