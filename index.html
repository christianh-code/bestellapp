<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestellapp</title>

    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/basket.css" />

    <script src="./scripts/db.js" defer></script>
    <script src="./scripts/template.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <header class="mainHeader">
    <div class="headerContent">
      <img
        class="headerLogo"
        src="./assets/icons/logo.svg"
        alt="BestellApp logo"
      />

      <img class="menuIcon" src="./assets/icons/menu.svg" alt="menu-icon" />
    </div>
  </header>
<body>
  <main>
    <div class="hero">
      <img
        class="hero-image"
        src="./assets/img/hero-pic.jpg"
        alt="Selection of burgers, pizza and salad"
      />
    </div>

    <div class="restaurant-info">
      <img
        class="restaurant-logo"
        src="./assets/img/burger-header-logo.svg"
        alt="BurgerHouse logo"
      />

      <div class="restaurant-heading">
        <h1 class="restaurant-name"><span>Burger</span>House</h1>

        <div class="restaurant-rating">
          <img class="rating-star" src="./assets/icons/star.svg" alt="Star" />

          <span class="rating-value">4,1</span>
          <span class="rating-count">(317)</span>
        </div>
      </div>

      <p class="restaurant-slogan">
        The best of Burgers, Pizza, and Greens, all in one great place.
      </p>
    </div>
    <div class="burger-banner">
      <div class="burger-banner-content">
        <img
          class="burger-icon"
          src="./assets/icons/burger-icon.png"
          alt="Burger"
        />

        <h2 class="burger-title">Burger & Sandwiches</h2>
      </div>
    </div>
    <div id="burgerList" class="burger-list"></div>
  </main>

</body>
</html>
